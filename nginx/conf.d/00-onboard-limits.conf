# Rate-limit zones for the public onboarding path.
#
# Loaded first (alphabetical `00-...`) so both zones exist in the http
# context before command-nexus.conf tries to reference them in its
# `location /onboard/` block.
#
# Two axes:
#   * onboard_by_ip     — max 6 requests/min per unique client IP. Kills
#                         opportunistic bots and slow-drip probes without
#                         inconveniencing a real new hire (they'll submit
#                         once).
#   * onboard_by_token  — max 12 requests/min bucketed by URI. If someone
#                         has one valid link, this caps their ability to
#                         probe the submit endpoint on that specific
#                         token even if they spread across IPs.
#
# Zone memory is generous — 10m holds ~160k IPs; we'll never see that
# volume but the sizing is cheap.
limit_req_zone $binary_remote_addr zone=onboard_by_ip:10m    rate=6r/m;
limit_req_zone $request_uri        zone=onboard_by_token:10m rate=12r/m;

# Pass through the original scheme from Cloudflare tunnel rather
# than hardcoding $scheme (which would always be "http" since
# cloudflared→nginx is plaintext on 127.0.0.1:8080). Falls back to
# $scheme for direct local access where no X-Forwarded-Proto is set.
# Needed so Fleet Watch's FastAPI `url_for()` generates https:// URLs
# when the original request came in over the Cloudflare tunnel.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
    http http;
}

server {
    listen 80;
    server_name localhost;
    server_tokens off;
    # TLS terminated upstream by Cloudflare tunnel (production) or direct HTTP (internal dev)

    # Use Docker's embedded DNS so nginx re-resolves if the API container restarts
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://nexus-v2-api:8000;
    # Fleet Watch viewer — separate Docker stack on the `nexus-shared`
    # external network. nginx joins that network too so the DNS name
    # resolves. Set as a variable so nginx doesn't fail to start if
    # the viewer container is down — it'll just 502 until it's back.
    set $fleetwatch_upstream http://dashcam-viewer:8090;

    # ── Real client IP from Cloudflare tunnel ───────────────────────────
    # cloudflared runs on the host and reaches nginx via the docker-proxy,
    # so $remote_addr is always the docker bridge gateway (172.x.y.1) for
    # tunneled requests. Trust that gateway + loopback to set CF-Connecting-IP,
    # which Cloudflare always writes with the real client IP. After this
    # runs, the allow/deny checks below evaluate the REAL client IP.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.0/8;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # IP allowlist. Evaluated against $remote_addr AFTER real_ip_module
    # rewrites it — so for tunneled requests, this checks the real client
    # IP (from CF-Connecting-IP). For direct LAN hits to :8080, the header
    # is absent and $remote_addr stays at the docker bridge gateway, so
    # we still need 172.16.0.0/12 to keep LAN direct access working.
    #
    # This is NOT a tunnel bypass: Cloudflare sets CF-Connecting-IP
    # authoritatively on every tunneled request, so tunnel traffic is
    # always checked against the real client IP, never against 172.16/12.
    allow 127.0.0.1;          # Localhost (container-local health checks)
    allow ::1;                # Localhost IPv6
    allow 10.0.0.0/8;         # Direct LAN access (pre-NAT source)
    allow 172.16.0.0/12;      # Direct LAN access (post-docker-proxy NAT)
    include /etc/nginx/conf.d/allowlist.conf;
    deny all;

    # Request size limits
    client_max_body_size 10m;
    client_body_timeout 30s;

    # Auto-generated redirects (trailing-slash, etc.) emit relative
    # Locations so the browser resolves against the original scheme.
    # Without this, nginx uses $scheme="http" because cloudflared→nginx
    # is plain HTTP — and external clients get a Location: http://...
    # downgrade on every implicit redirect (pentest M4, 2026-05-17).
    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # camera=() — aligned with external Cloudflare policy. Pentest L1
    # (2026-05-17) flagged camera=(self) as more-permissive on the
    # internal origin; we don't use camera here.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP for nexus pages is set by `app.security.csp.CSPNonceMiddleware`
    # because the script-src needs a per-request nonce (nginx can't
    # generate one without sub_filter substitution). The header here is
    # only for FLEET WATCH responses, which still rely on nginx-level
    # CSP. Fleet routes are under `location /fleet/` below.
    #
    # img-src allows the Leaflet tile providers Fleet Watch uses on
    # the GPS route panel: standard OSM raster tiles + ESRI world-
    # imagery for the satellite toggle.
    set $csp_fleet "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com https://*.tile.openstreetmap.org https://server.arcgisonline.com; media-src 'self' blob:; frame-ancestors 'none';";

    # Health check — no rate limit
    location /health {
        proxy_pass $api_upstream;
        proxy_redirect http:// https://;
    }

    # Static files — cache-busting for dev.
    #
    # We're iterating on CSS/JS constantly right now. The old rule
    # here set `public, max-age=604800, immutable` which meant
    # every CSS tweak required the user to hard-refresh their
    # browser AND purge Cloudflare before the change was visible.
    # Flipping to no-store matches what we did for /fleet/static/
    # so both app stacks behave the same during active dev.
    #
    # Before production: swap this for versioned URLs
    # (e.g. style.css?v=<build_hash>) and restore aggressive
    # caching. Fleet's tracking that as a pre-prod checklist item
    # and the same applies here.
    #
    # Re-declares the server-level security headers because any
    # add_header in a nested location block nukes inheritance
    # from the server block.
    location /static/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_redirect http:// https://;

        # Re-declared server-level security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Strip upstream cache headers and force no-store at the
        # edge + browser.
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # Auth endpoints — Google OAuth callback synchronously syncs group
    # memberships via the Admin SDK on first login per session, which can
    # take 10-25s on a cold call. 45s leaves headroom without masking a
    # real hang. Keep connect timeout tight.
    location /auth/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 45s;
        proxy_connect_timeout 5s;
        proxy_redirect http:// https://;
    }

    # API endpoints
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_redirect http:// https://;

        # Prevent response buffering for streaming exports
        proxy_buffering off;
    }

    # Fabric-wide bulk operations — fan out to ~100 switches with SSH +
    # telnet fallback can take 60-90 s on the slowest runs. Bumped from
    # /api/'s 60 s so the proxy doesn't 504 before the backend finishes.
    location /api/network/bulk-vlan/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_redirect http:// https://;
        proxy_buffering off;
    }

    # PoE cycle holds the request open for the off-window (up to 300 s).
    # Same timeout as bulk-vlan covers the worst case.
    location /api/network/switch/poe {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        proxy_connect_timeout 10s;
        proxy_redirect http:// https://;
        proxy_buffering off;
    }

    # Single-port VLAN editor writes also do live show+config+write-mem over
    # SSH and can run 30-60s on slower 2930s. Default /api/ timeout is 60s
    # which surfaces as an HTML 504 in the UI. Bump to 180s.
    location /api/network/switch/vlan- {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_redirect http:// https://;
        proxy_buffering off;
    }

    # Dev tools — long-running load tests
    location /api/dev/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 10s;
        proxy_redirect http:// https://;
    }

    # ── Fleet Watch (separate Docker stack) ────────────────────
    # Routes /fleet/* to the dashcam-viewer container on the
    # nexus-shared external network. Mirrors the $api_upstream
    # pattern: variable proxy_pass so nginx doesn't fail at
    # startup if the viewer isn't running yet (returns 502 until
    # the container is up, instead of refusing to start).
    #
    # The viewer's FastAPI app has `root_path="/fleet"` for URL
    # generation, but its routes are defined without that prefix
    # — so we MUST strip /fleet/ before proxying. With a variable
    # proxy_pass, nginx doesn't do the location-prefix replacement
    # automatically the way it does with a literal URI suffix, so
    # we use an explicit `rewrite ... break` to drop /fleet/
    # before the proxy step. End result: a request for
    # /fleet/timeline arrives at the viewer as /timeline.
    #
    # Bare /fleet (no slash) gets a 301 to /fleet/ so url_for()
    # output keeps working. Otherwise nginx would fall through to
    # `location /` and serve a Nexus 404 page.
    location = /fleet {
        return 301 /fleet/;
    }
    # More-specific match for Fleet Watch static assets — longest
    # prefix wins in nginx, so /fleet/static/* hits this block
    # instead of the generic /fleet/ one below. We need a separate
    # block only because we want different Cache-Control behavior
    # for static files than for HTML / API responses.
    #
    # Why no-store: fleet rebuilds style.css and viewer.js on every
    # iteration. Cloudflare caches static assets aggressively by
    # default (2h+ at the edge, hours-to-days in the browser), so
    # every rebuild requires a manual cache purge or users see
    # stale CSS. While the app is in active development, tell
    # browsers AND Cloudflare not to cache these at all.
    #
    # Before production traffic: swap this for versioned URLs
    # (e.g. style.css?v=<build_hash>) + `Cache-Control: public,
    # max-age=31536000, immutable` and remove this location block.
    #
    # The security headers MUST be re-declared here — adding
    # any `add_header` directive in a nested block nukes the
    # inheritance from the server block. Copy-paste is ugly but
    # it's the only native-nginx way to express "inherit + add".
    location /fleet/static/ {
        rewrite ^/fleet/(.*)$ /$1 break;
        proxy_pass $fleetwatch_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /fleet;
        proxy_redirect http:// https://;

        # Re-declared server-level security headers (add_header
        # below breaks inheritance).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy $csp_fleet always;

        # Cache-busting for dev. Strip whatever upstream sends,
        # then force no-store. Cloudflare respects this header
        # and will not cache the response at the edge.
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }
    location /fleet/ {
        rewrite ^/fleet/(.*)$ /$1 break;
        proxy_pass $fleetwatch_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Pass through the upstream's understanding of where it
        # is mounted, so root_path-aware URL generation lines up
        # if the viewer's framework reads X-Forwarded-Prefix.
        proxy_set_header X-Forwarded-Prefix /fleet;
        proxy_redirect http:// https://;
        # Video clips can be large; allow long-running byte-range
        # streams without timing out, and disable nginx's
        # buffering so the first byte reaches the browser
        # immediately and seek scrubbing stays responsive.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        # Larger client_max_body_size for any future media upload
        # endpoints (the viewer is mostly read-only today).
        client_max_body_size 50m;

        # Re-declared server-level security headers (any
        # add_header in a nested block breaks inheritance of the
        # server-level set, so we copy them here). Fleet still uses
        # the unsafe-inline CSP — nonces are nexus-only for now.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy $csp_fleet always;

        # Cache-busting for all Fleet Watch HTML + API responses.
        # Clip landing pages use URLs like
        #   /fleet/clip/20260410_102741_NF.mp4
        # which end in `.mp4` but actually return an HTML player
        # page. Cloudflare's default file-extension heuristic
        # treats them as video files and caches the HTML at the
        # edge aggressively (hours), so rebuilds of the viewer
        # template don't reach users until a manual cache purge.
        # Strip any upstream cache headers and force no-store at
        # the edge + browser. Covers all routes under /fleet/ —
        # static assets have a more-specific location block with
        # the same behavior. Byte-range video streams also become
        # no-store, which is fine for a small internal tool (no
        # meaningful cache-hit rate on unique clip URLs anyway).
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # Public onboarding endpoints — carve-out from the server-level
    # IP allowlist so a new hire can submit from anywhere. Defense in
    # depth:
    #   1. Cloudflare Access has a Bypass rule for this path scoped to
    #      Country == US AND Region ∈ {OH,KY,WV,PA,IN,MI} (managed in
    #      the CF dashboard — see project_cloudflare_lockdown notes).
    #   2. Belt-and-suspenders country check via CF-IPCountry header
    #      here — if CF is somehow bypassed OR CF returns a non-US
    #      country, we 403 at the origin. The header is set on every
    #      request that transited Cloudflare (Free plan+).
    #   3. Two-axis rate limit — per-IP and per-URI.
    #   4. Route-level audit log fires inside FastAPI on every hit.
    # The token itself remains the actual authentication — random 32-
    # byte, single-use, TTL-bound.
    location /onboard/ {
        # Override the server-level `deny all` for this path only.
        allow all;

        # Origin-side country gate. Empty string catches direct
        # LAN/localhost hits (which don't carry the header); permitted
        # so admins can smoke-test on the LAN without CF in the loop.
        # Everything else must be US.
        if ($http_cf_ipcountry !~ ^(US|)$) {
            return 403;
        }

        limit_req zone=onboard_by_ip    burst=10 nodelay;
        limit_req zone=onboard_by_token burst=4  nodelay;

        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Preserve the country / region hints CF adds so the app-side
        # audit log can record them.
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-IPCity    $http_cf_ipcity;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_redirect http:// https://;
    }

    # All other routes (pages)
    location / {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_redirect http:// https://;
    }

    # Block common attack paths
    location ~ /\. {
        deny all;
        return 404;
    }
}

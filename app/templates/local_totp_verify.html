<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2-factor code — Nexus</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0d1117; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 20px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 40px; max-width: 400px; width: 100%; }
        h1 { font-size: 20px; margin-bottom: 8px; }
        p.sub { font-size: 13px; color: #8b949e; margin-bottom: 24px; }
        label { display: block; font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
        input { width: 100%; padding: 9px 12px; background: #0d1117; border: 1px solid #30363d; color: #e6edf3; border-radius: 4px; font-size: 20px; font-family: ui-monospace, monospace; text-align: center; letter-spacing: 6px; }
        input:focus { outline: none; border-color: #58a6ff; }
        button { width: 100%; margin-top: 20px; padding: 10px; background: #1f6feb; color: #fff; font-size: 14px; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background: #388bfd; }
        .error { background: rgba(248, 81, 73, 0.1); border: 1px solid rgba(248, 81, 73, 0.35); color: #f85149; padding: 10px 14px; border-radius: 6px; font-size: 12px; margin-bottom: 16px; }
        .hint { color: #8b949e; font-size: 11px; margin-top: 16px; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Enter 2-factor code</h1>
        <p class="sub">Open your authenticator app and enter the current 6-digit code for Command Nexus.</p>

        {% if err %}
        <div class="error">
            {% if err == 'bad_code' %}That code didn't match. Try again — codes rotate every 30 seconds.
            {% else %}Error: {{ err }}{% endif %}
        </div>
        {% endif %}

        <form method="POST" action="/auth/local/totp-verify">
            <label for="code">6-digit code</label>
            <input id="code" type="text" name="code" inputmode="numeric" pattern="[0-9 ]*" maxlength="7" autocomplete="one-time-code" required autofocus>
            <button type="submit">Verify</button>
        </form>

        <p class="hint"><a href="/auth/local/logout" style="color:#58a6ff;text-decoration:none">Sign out</a></p>
    </div>
</body>
</html>
